# Opcjonalnie: PostgreSQL lokalnie (docker compose up -d db)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: anomaly
      POSTGRES_PASSWORD: anomaly
      POSTGRES_DB: anomaly
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
